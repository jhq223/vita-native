[package]
name = "vita-native"
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Owned GXM graphics, application services, audio and video for PlayStation Vita"
repository = "https://github.com/jhq223/vita-native"

[features]
profiling = ["vitasdk-sys/ScePerf_stub"]
process-allocator = ["app"]
default = ["app", "graphics", "audio"]
app = ["vitasdk-sys/SceLibKernel_stub", "vitasdk-sys/SceKernelThreadMgr_stub", "vitasdk-sys/SceProcessmgr_stub", "vitasdk-sys/SceRtc_stub", "vitasdk-sys/SceCtrl_stub", "vitasdk-sys/SceTouch_stub", "vitasdk-sys/ScePower_stub", "vitasdk-sys/SceIofilemgr_stub", "vitasdk-sys/SceAppMgr_stub", "vitasdk-sys/SceIme_stub", "vitasdk-sys/SceSysmodule_stub"]
graphics = ["vitasdk-sys/SceLibKernel_stub", "vitasdk-sys/SceKernelThreadMgr_stub", "vitasdk-sys/SceGxm_stub", "vitasdk-sys/SceDisplay_stub", "vitasdk-sys/SceKernelDmacMgr_stub"]
audio = ["app", "vitasdk-sys/SceAudio_stub"]
video = ["app", "vitasdk-sys/SceAvPlayer_stub", "vitasdk-sys/SceKernelDmacMgr_stub"]

[target.'cfg(target_os = "vita")'.dependencies]
vitasdk-sys = { version = "=0.3.3", features = ["SceSysmem_stub"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = "thin"

[build-dependencies]
cc = "=1.8.0"
